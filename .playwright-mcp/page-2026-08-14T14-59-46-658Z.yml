              - button "Copy" [ref=e486] [cursor=pointer]
            - paragraph [ref=e489]:
              - text: "Neither connects to Microsoft Graph or touches a mailbox, and neither needs credentials. The smoke test starts the server over stdio and checks what an MCP client actually sees: the tool list, input schemas,"
