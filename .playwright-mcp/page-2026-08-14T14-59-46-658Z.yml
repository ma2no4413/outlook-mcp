            - heading "Moving shelves instead of mail" [level=3] [ref=e433]
            - paragraph [ref=e434]:
              - code [ref=e435]: move_folder
              - text: changes a folder's parent. Messages stay where they are, keep their IDs, and the inbox rules that point at that folder keep working — Graph preserves folder IDs across renames and moves. Doing the same thing message by message would mean hundreds of calls and would invalidate every ID.
            - heading "Bulk operations" [level=3] [ref=e436]
            - paragraph [ref=e437]:
              - text: Batched 20 at a time through the Graph
              - code [ref=e438]: /$batch
              - text: endpoint, with
              - strong [ref=e439]: per-item status checks
              - text: . A batch can return HTTP 200 overall while individual entries fail — treating the batch as all-or-nothing would mean reprocessing thousands of messages because a handful got throttled. Re-running picks up only what failed.
            - generic [ref=e440]:
              - code [ref=e444]: move_by_search(dest="99_Archive", folder="Newsletters") → scanned 6,000 → matched 6,000 [dry run — nothing moved yet] move_by_search(dest="99_Archive", folder="Newsletters", dry_run=False) → moved 6,000 messages to 99_Archive.
              - button "Copy" [ref=e446] [cursor=pointer]
            - paragraph [ref=e449]:
              - code [ref=e450]: move_by_search
              - text: refuses calls with no filter at all, so "move the entire mailbox" cannot happen by accident.
              - code [ref=e451]: mark_read_by_search
              - text: allows it, since marking read does not relocate anything — but it warns that read state is not recoverable.
            - separator [ref=e452]
            - paragraph
            - heading "Known limits" [level=2] [ref=e453]
            - list [ref=e454]:
              - listitem [ref=e455]:
                - paragraph [ref=e456]:
                  - strong [ref=e457]: Keyword search and strict date ordering are mutually exclusive.
                  - text: Graph does not allow
                  - code [ref=e458]: $search
                  - text: together with
                  - code [ref=e459]: $filter
                  - text: /
                  - code [ref=e460]: $orderby
                  - text: . With a keyword the server fetches up to 100 relevance-ranked results and re-sorts them locally; without one it uses
                  - code [ref=e461]: $filter
                  - text: +
                  - code [ref=e462]: $orderby
                  - text: for true date order. When more than 100 match, the response says so.
              - listitem [ref=e463]:
                - paragraph [ref=e464]:
                  - code [ref=e465]:
                    - strong [ref=e466]: since
                  - strong [ref=e467]: /
                  - code [ref=e468]:
                    - strong [ref=e469]: until
                  - strong [ref=e470]: are UTC.
                  - text: For a strict local-time day, fetch a wider window and narrow locally.
              - listitem [ref=e471]:
                - paragraph [ref=e472]:
                  - strong [ref=e473]: Folder listing stops at three levels.
                  - text: Deeper folders are not listed, though operations on them work.
              - listitem [ref=e474]:
                - paragraph [ref=e475]:
                  - strong [ref=e476]: Large runs can be throttled.
                  - text: Items that fail with
                  - code [ref=e477]: MailboxConcurrency limit
                  - text: are reported; re-run the same call to process the remainder.
            - separator [ref=e478]
            - paragraph
