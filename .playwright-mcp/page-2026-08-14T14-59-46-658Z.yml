            - paragraph [ref=e217]:
              - text: "Two delegated permissions are requested:"
              - code [ref=e218]:
                - strong [ref=e219]: Mail.ReadWrite
              - text: and
              - code [ref=e220]:
                - strong [ref=e221]: MailboxSettings.ReadWrite
              - text: (the latter only for inbox rules).
            - separator [ref=e222]
            - paragraph
            - heading "Setup" [level=2] [ref=e223]
            - paragraph [ref=e224]:
              - strong [ref=e225]: Requirements
              - text: ": Python 3.10+, a Microsoft account, and Claude Code or another MCP client."
            - paragraph [ref=e226]: You do two things by hand. Everything else is handled by the agent.
            - heading "1. Register an app in Azure — by hand, once" [level=3] [ref=e227]
            - paragraph [ref=e228]: "You need one GUID: an application (client) ID. It is free and does not require an Azure subscription."
            - paragraph [ref=e229]:
              - text: This step involves browser sign-in and a consent screen, so do it yourself and read what you are approving —
              - strong [ref=e230]: you are issuing access to your own mailbox
              - text: .
            - paragraph [ref=e231]:
              - text: →
              - link [ref=e232] [cursor=pointer]:
                - /url: https://github.com/ma2no4413/outlook-mcp/blob/main/docs/AZURE.en.md
                - strong [ref=e233]: docs/AZURE.en.md
            - paragraph [ref=e234]: "It documents two traps that cost real time, both specific to personal Microsoft accounts: redirect URIs that must exist even though device code flow never visits them, and a permission that does not take effect until you re-consent."
            - heading "2. Everything else — hand it to Claude Code" [level=3] [ref=e235]
            - paragraph [ref=e236]: "Clone the repository, start Claude Code in it, and say:"
            - generic [ref=e237]:
              - code [ref=e241]: Read docs/SETUP-FOR-CLAUDE.md and set this up
              - button "Copy" [ref=e243] [cursor=pointer]
            - paragraph [ref=e246]:
              - text: The agent creates the virtual environment, installs dependencies, writes
              - code [ref=e247]: .env
              - text: ", registers the MCP server, and verifies the connection. It stops once and asks you to run"
              - code [ref=e248]: login.py
              - text: yourself, because device code flow needs a browser and cannot be completed by an agent.
            - blockquote [ref=e249]:
              - paragraph [ref=e250]:
                - strong [ref=e251]: That runbook is written in Japanese.
                - text: That is fine — the reader is an agent, and Claude follows it without trouble. If you would rather read it yourself, the
                - link "manual steps" [ref=e252] [cursor=pointer]:
                  - /url: https://github.com/ma2no4413/outlook-mcp/blob/main/README.ja.md#%E3%82%BB%E3%83%83%E3%83%88%E3%82%A2%E3%83%83%E3%83%97
                - text: are short.
            - separator [ref=e253]
            - paragraph
            - heading "Docker (optional)" [level=3] [ref=e254]
            - paragraph [ref=e255]: Not required for normal use — running it directly is simpler. Provided for sandboxed runs and registry checks.
            - generic [ref=e256]:
              - code [ref=e260]: "docker build -t outlook-mcp . # first sign-in (device code flow needs a terminal) docker run -it --rm -e OUTLOOK_CLIENT_ID=<your-id> \\ -v outlook-mcp-token:/app/data -e OUTLOOK_TOKEN_CACHE=/app/data/token_cache.json \\ outlook-mcp python login.py # as an MCP server (stdio: -i, never -t) docker run -i --rm -e OUTLOOK_CLIENT_ID=<your-id> \\ -v outlook-mcp-token:/app/data -e OUTLOOK_TOKEN_CACHE=/app/data/token_cache.json \\ outlook-mcp"
              - button "Copy" [ref=e262] [cursor=pointer]
            - paragraph [ref=e265]: Credentials are never baked into the image. The token cache lives in a named volume — it is the key to your mailbox, so keep it out of images and repositories.
