<svg xmlns="http://www.w3.org/2000/svg" width="900" height="404" viewBox="0 0 900 404" role="img" aria-label="Terminal session sorting 140 inbox messages by sender into existing folders, leaving the inbox empty">
  <style>
    .t { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 13.5px; }
    .you  { fill: #7ee787; }
    .cc   { fill: #d2a8ff; }
    .tool { fill: #8b949e; }
    .txt  { fill: #c9d1d9; }
    .num  { fill: #79c0ff; }
    .ok   { fill: #7ee787; font-weight: 700; }
    .dim  { fill: #6e7681; }
    .cap  { fill: #8b949e; font-size: 11.5px; }
  </style>

  <rect x="0" y="0" width="900" height="404" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <path d="M0 10a10 10 0 0 1 10-10h880a10 10 0 0 1 10 10v26H0z" fill="#161b22"/>
  <line x1="0" y1="36" x2="900" y2="36" stroke="#30363d" stroke-width="1"/>
  <circle cx="20" cy="18" r="5.5" fill="#ff5f57"/>
  <circle cx="40" cy="18" r="5.5" fill="#febc2e"/>
  <circle cx="60" cy="18" r="5.5" fill="#28c840"/>
  <text class="t cap" x="84" y="22">outlook-mcp — Claude Code</text>

  <text class="t you"  x="24" y="72">▸ You</text>
  <text class="t txt"  x="24" y="94">  Sort my inbox by sender and leave it empty</text>

  <text class="t cc"   x="24" y="132">● Claude</text>
  <text class="t tool" x="24" y="154">  search_messages(folder="Inbox", limit=50)</text>
  <text class="t txt"  x="24" y="176">  Found <tspan class="num">140 messages</tspan>. Routing them into folders you already have.</text>

  <text class="t tool" x="24" y="212">  move_by_search(from_address="Dining Co", dest="06_Shop/Meal/Dining Co")</text>
  <text class="t dim"  x="24" y="232">    scanned 108 → matched <tspan class="num">9</tspan> … moved 9 messages.</text>
  <text class="t tool" x="24" y="256">  move_by_search(from_address="Broker Inc", dest="02_Invest/Broker Inc")</text>
  <text class="t dim"  x="24" y="276">    scanned 99 → matched <tspan class="num">6</tspan> … moved 6 messages.</text>
  <text class="t dim"  x="24" y="300">    … 20 more senders</text>

  <text class="t txt"  x="24" y="338">  Inbox <tspan class="num">140</tspan> → <tspan class="ok">0</tspan>.</text>
  <text class="t txt"  x="24" y="360">  <tspan class="dim">Nothing deleted. Every message moved into a folder you already had.</tspan></text>

  <text class="t cap"  x="24" y="388">This server has no send tool and no permanent delete. The worst case is your Deleted Items folder.</text>
</svg>
