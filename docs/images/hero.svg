<svg xmlns="http://www.w3.org/2000/svg" width="900" height="404" viewBox="0 0 900 404" role="img" aria-label="Claude Code で受信トレイ140件を差出人ごとに振り分け、0件にするまでのターミナル画面">
  <style>
    .t { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", "Noto Sans JP", monospace; font-size: 13.5px; }
    .you  { fill: #7ee787; }
    .cc   { fill: #d2a8ff; }
    .tool { fill: #8b949e; }
    .txt  { fill: #c9d1d9; }
    .num  { fill: #79c0ff; }
    .ok   { fill: #7ee787; font-weight: 700; }
    .dim  { fill: #6e7681; }
    .cap  { fill: #8b949e; font-size: 11.5px; }
  </style>

  <rect x="0" y="0" width="900" height="404" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <path d="M0 10a10 10 0 0 1 10-10h880a10 10 0 0 1 10 10v26H0z" fill="#161b22"/>
  <line x1="0" y1="36" x2="900" y2="36" stroke="#30363d" stroke-width="1"/>
  <circle cx="20" cy="18" r="5.5" fill="#ff5f57"/>
  <circle cx="40" cy="18" r="5.5" fill="#febc2e"/>
  <circle cx="60" cy="18" r="5.5" fill="#28c840"/>
  <text class="t cap" x="84" y="22">outlook-mcp — Claude Code</text>

  <text class="t you"  x="24" y="72">▸ あなた</text>
  <text class="t txt"  x="24" y="94">  受信トレイを差出人ごとに振り分けて空にして</text>

  <text class="t cc"   x="24" y="132">● Claude</text>
  <text class="t tool" x="24" y="154">  search_messages(folder="受信トレイ", limit=50)</text>
  <text class="t txt"  x="24" y="176">  <tspan class="num">140件</tspan>を確認しました。既存のフォルダへ流し込みます。</text>

  <text class="t tool" x="24" y="212">  move_by_search(from_address="ぐるなび", dest="06_Shop/Meal/ぐるなび")</text>
  <text class="t dim"  x="24" y="232">    走査 108件 → 該当 <tspan class="num">9件</tspan> … 9件を移動しました。</text>
  <text class="t tool" x="24" y="256">  move_by_search(from_address="マネックス", dest="02_Invest/マネックス証券")</text>
  <text class="t dim"  x="24" y="276">    走査 99件 → 該当 <tspan class="num">6件</tspan> … 6件を移動しました。</text>
  <text class="t dim"  x="24" y="300">    … ほか 20 の差出人</text>

  <text class="t txt"  x="24" y="338">  受信トレイ <tspan class="num">140件</tspan> → <tspan class="ok">0件</tspan>。</text>
  <text class="t txt"  x="24" y="360">  <tspan class="dim">削除はゼロ。すべて既存のフォルダへ移動しました。</tspan></text>

  <text class="t cap"  x="24" y="388">送信も完全削除もできないサーバなので、最悪でもゴミ箱止まりです。</text>
</svg>
