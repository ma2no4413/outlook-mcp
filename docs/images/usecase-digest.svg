<svg xmlns="http://www.w3.org/2000/svg" width="900" height="392" viewBox="0 0 900 392" role="img" aria-label="一日分の受信メールから実質的な情報だけを要約して提示するターミナル画面">
  <style>
    .t { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", "Noto Sans JP", monospace; font-size: 13.5px; }
    .you  { fill: #7ee787; }
    .cc   { fill: #d2a8ff; }
    .tool { fill: #8b949e; }
    .txt  { fill: #c9d1d9; }
    .num  { fill: #79c0ff; }
    .hd   { fill: #ffa657; font-weight: 700; }
    .dim  { fill: #6e7681; }
    .cap  { fill: #8b949e; font-size: 11.5px; }
  </style>

  <rect x="0" y="0" width="900" height="392" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <path d="M0 10a10 10 0 0 1 10-10h880a10 10 0 0 1 10 10v26H0z" fill="#161b22"/>
  <line x1="0" y1="36" x2="900" y2="36" stroke="#30363d" stroke-width="1"/>
  <circle cx="20" cy="18" r="5.5" fill="#ff5f57"/>
  <circle cx="40" cy="18" r="5.5" fill="#febc2e"/>
  <circle cx="60" cy="18" r="5.5" fill="#28c840"/>
  <text class="t cap" x="84" y="22">一日分の要約 — search_messages + get_message</text>

  <text class="t you"  x="24" y="72">▸ あなた</text>
  <text class="t txt"  x="24" y="94">  昨日届いたメールで有益なものをピックアップして</text>

  <text class="t cc"   x="24" y="132">● Claude</text>
  <text class="t tool" x="24" y="154">  search_messages(since="...", until="...", include_preview=true)</text>
  <text class="t txt"  x="24" y="176">  <tspan class="num">76件</tspan>のうち、実質的な情報を含むのは <tspan class="num">6件</tspan> でした。</text>

  <text class="t hd"   x="24" y="212">  ■ 決算</text>
  <text class="t txt"  x="24" y="232">    大手クラウドが設備投資計画を 2000億 → 2200億ドルへ引き上げ。</text>
  <text class="t txt"  x="24" y="252">    理由はメモリ価格の上昇。「2027年も供給が足りない」との見通し。</text>

  <text class="t hd"   x="24" y="286">  ■ 金利</text>
  <text class="t txt"  x="24" y="306">    普通預金の優遇金利 0.38%。来月から +0.10% 改定予定。</text>

  <text class="t dim"  x="24" y="342">  残り70件は広告・通知でした。差出人ごとの内訳を出しますか?</text>
  <text class="t cap"  x="24" y="370">読み取りだけの操作です。メールボックスは一切変更されません。</text>
</svg>
