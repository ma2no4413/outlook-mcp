name: CI

on:
  push:
    branches: [main]
  pull_request:
  # requirements.txt は下限しか固定していない。上流の新版で壊れていないかを
  # 週次で確かめる。触っていないのに落ちたら、それは依存側の変化。
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # README は Python 3.10 以上、3つのOSを謳っている。その主張をここで検証する。
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 依存をインストール
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: 単体テスト
        run: python -m pytest -q

      # サーバを stdio で起動し、MCPクライアントから見える外形を検証する。
      # 認証情報も .env も無い状態で回る。むしろ「無くても起動して
      # ツール一覧に応答する」ことがこのテストの主眼。
      - name: スモークテスト (stdio)
        run: python smoke_test.py

      # publish はタグを打った後にしか走らない。そこで弾かれるとタグを消して
      # やり直しになるため、レジストリの制約はここで先に確認する。
      - name: server.json の妥当性
        run: python validate_server_json.py

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: イメージをビルド
        run: docker build -t outlook-mcp .

      # 認証情報の混入は最も避けたい事故なので、成果物側で確かめる。
      - name: 認証情報が焼き込まれていないこと
        run: |
          found=$(docker run --rm --entrypoint sh outlook-mcp -c \
            'find / \( -name ".env" -o -name "token_cache.json" -o -name "unread-backup.json" \) 2>/dev/null | head -1')
          if [ -n "$found" ]; then
            echo "::error::認証情報がイメージに含まれています: $found"
            exit 1
          fi
          echo "混入なし"

      - name: 非 root で動作すること
        run: |
          uid=$(docker run --rm --entrypoint sh outlook-mcp -c 'id -u')
          if [ "$uid" = "0" ]; then
            echo "::error::root で動作しています"
            exit 1
          fi
          echo "uid=$uid"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Glama のようなレジストリが行う検査と同じこと。コンテナを stdio サーバとして
      # 起動し、initialize と3種の list に応答するかを見る。
      - name: コンテナに対して MCP introspection
        run: |
          python -m pip install --quiet -r requirements.txt
          python - <<'PY'
          import asyncio
          from mcp import ClientSession, StdioServerParameters
          from mcp.client.stdio import stdio_client

          async def main() -> None:
              params = StdioServerParameters(
                  command="docker", args=["run", "-i", "--rm", "outlook-mcp"]
              )
              async with stdio_client(params) as (reader, writer):
                  async with ClientSession(reader, writer) as session:
                      init = await session.initialize()
                      tools = (await session.list_tools()).tools
                      # 未実装でも空リストで応答する必要がある。エラーだと検査が落ちる。
                      await session.list_resources()
                      await session.list_prompts()
                      assert init.server_info.name == "outlook", init.server_info.name
                      assert tools, "ツールが1つも公開されていない"
                      print(f"initialize OK / {len(tools)} tools / resources と prompts も応答")

          asyncio.run(main())
          PY
